services:
  postgres:
    image: postgres:15.19
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://app:secret@postgres:5432/app
      DATA_SOURCE: ${DATA_SOURCE:-sample}
      TZ: ${TZ:-UTC}
      JIRA_SITE_URL: ${JIRA_SITE_URL:-}
      JIRA_BOARD_ID: ${JIRA_BOARD_ID:-}
      JIRA_EMAIL: ${JIRA_EMAIL:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/app/data
    command: ["npm", "run", "start"]
    working_dir: /app

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      TZ: ${TZ:-UTC}
    working_dir: /app

volumes:
  postgres_data:
